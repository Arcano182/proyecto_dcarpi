<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D´CARPI - Producto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div class="container py-5">
    <a class="btn btn-outline-secondary mb-3" href="/">← Volver</a>

    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title">Producto: {{ nombre }}</h3>
        <p class="card-text">Producto: <strong>{{ nombre }}</strong> – disponible en D´CARPI.</p>
        <p class="text-muted mb-0">(Ruta dinámica funcionando)</p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
